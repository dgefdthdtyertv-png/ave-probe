name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl perl libxml2-utils

      - name: Setup Theos
        run: |
          git clone https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # 新版theos用这个脚本下载SDK
          cd $HOME/theos
          curl -s https://raw.githubusercontent.com/theos/sdks/master/install.py | python3

      - name: Build Tweak
        run: |
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libSandboxExt
          path: .theos/obj/arm64e/SandboxExt.dylib
