name: Build AVE Probe IPA
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build binary & package IPA
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: aveprobe-ipa
          path: ./aveprobe.ipa
