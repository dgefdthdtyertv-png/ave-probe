name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos + SDK
        run: |
          git clone https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          # 自动下载iOS15 SDK
          cd $HOME/theos
          ./bin/install.sh

      - name: Build Tweak
        run: |
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libSandboxExt
          path: .theos/obj/arm64e/SandboxExt.dylib
