name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Theos Action
        uses: theos/theos-action@v1
        with:
          sdk: 15.0

      - name: Build
        run: make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libSandboxExt
          path: .theos/obj/arm64e/SandboxExt.dylib
